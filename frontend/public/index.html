<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/college-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2b5c" />
    <meta
      name="description"
      content="Pioneers' Higher Education Academy, Waling, Syangja. Estd. 2044 B.S. Providing +2 Science & Management, CTEVT General Medicine (Health Assistant), Civil Engineering, and BBS."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/college-logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The hero photo is applied by React, so the browser cannot discover it in the HTML.
         Preload it and paint the page navy so the pre-mount window matches the hero. -->
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/background.webp"
      fetchpriority="high"
    />

    <!-- Google Fonts: Average (site-wide) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Average&display=swap"
      rel="stylesheet"
    />

    <title>Pioneers' Higher Education Academy | Waling, Syangja (Estd. 2044 B.S.)</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      html {
        background-color: #091a38;
      }

      /* Covers the pre-render window (HTML → CSS → JS → React mount) with the hero's
         navy and a spinner, so the first paint is never a blank page. */
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: linear-gradient(120deg, #091a38 0%, #12294f 55%, #2c3a55 100%);
        font-family: Georgia, 'Times New Roman', serif;
      }

      #initial-splash img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        border: 2px solid rgba(232, 200, 116, 0.55);
        border-radius: 50%;
        background: #ffffff;
        padding: 6px;
      }

      #initial-splash .splash-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(232, 200, 116, 0.22);
        border-top-color: #e8c874;
        border-radius: 50%;
        animation: splash-spin 0.85s linear infinite;
      }

      #initial-splash .splash-label {
        color: #e8c874;
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #initial-splash.done {
        animation: splash-out 0.4s ease forwards;
        pointer-events: none;
      }

      @keyframes splash-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-splash .splash-spinner {
          animation-duration: 2.4s;
        }

        #initial-splash.done {
          animation: none;
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="initial-splash">
      <img src="%PUBLIC_URL%/college-logo.png" alt="" />
      <div class="splash-spinner"></div>
      <div class="splash-label">Pioneers&rsquo; Academy</div>
    </div>
    <div id="root"></div>
  </body>
</html>
