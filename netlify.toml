[build]
  base = "frontend"
  command = "CI=false react-scripts build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/background.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/college-banner.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
